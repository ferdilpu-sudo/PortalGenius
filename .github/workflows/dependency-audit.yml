name: Dependency audit (diagnostic)

on:
  push:
    branches: [feat/m001-foundation-auth]
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Summarize dependency vulnerabilities without force upgrades
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node scripts/summarize-audit.mjs npm-audit-report.json
